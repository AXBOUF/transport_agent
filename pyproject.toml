[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-agent"
version = "0.1.0"
description = "Realtime transport intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49",
    "flask>=3.1.3",
    "flask-cors>=4.0.0",
    "folium>=0.20.0",
    "google>=3.0.0",
    "graphviz>=0.21",
    "gtfs-realtime-bindings>=2.0.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mcp>=1.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pip>=26.1",
    "protobuf>=7.0.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "render-template>=0.2.0",
    "requests>=2.33.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0",
]

[tool.uv]
package = false
